name: Bug report
description: Something in the library, CLI, or docs is broken or behaves incorrectly.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: github.com/ryftcore/dss-go/dss version or commit
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code, CLI command, or fixture that reproduces the issue.
      render: go
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or stack trace
      render: shell
    validations:
      required: false
