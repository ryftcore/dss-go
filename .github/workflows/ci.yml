name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum

      - name: gofmt
        working-directory: dss
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet (default + eaa)
        working-directory: dss
        run: |
          go vet ./...
          go vet -tags eaa ./...

      # Blocking: govet+staticcheck issues fail the job.
      #
      # Third-party action, so it is pinned to a commit SHA (v9.3.0), and
      # the golangci-lint version is pinned exactly rather than "latest":
      # the linter's type-checker must be built against a Go release at
      # least as new as the toolchain compiling this module, or it emits
      # mass spurious `typecheck` errors for code that compiles fine (v1.64.8
      # + a Go 1.26 runner did exactly that on the first run of this job).
      # .github/.golangci.yml is a v2-schema config to match.
      - name: golangci-lint (blocking)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: dss
          args: --config=../.github/.golangci.yml --default=none --enable=govet --enable=staticcheck

      # Advisory only: revive's exported-comment rule is useful signal but
      # must not block merges (see .github/.golangci.yml for why this is a
      # separate step rather than a config-level severity knob).
      - name: "golangci-lint (advisory: revive exported-comment)"
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: dss
          args: --config=../.github/.golangci.yml --default=none --enable=revive

  # Blocking: fails when code reachable from this module calls a function
  # with a known vulnerability, in a dependency or in the Go standard
  # library of the toolchain go.mod selects.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum

      - name: govulncheck (default + eaa)
        working-directory: dss
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags eaa ./...

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Go version comes from dss/go.mod (go-version-file below), so the
        # matrix varies only the OS; windows is a smoke-build leg.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum

      - name: go build
        working-directory: dss
        run: go build ./...

      - name: go build -tags eaa
        working-directory: dss
        run: go build -tags eaa ./...

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three roughly-balanced package groups so the suite runs in
        # parallel. Keep in sync with dss/'s top-level package list if new
        # top-level packages are added.
        group: [core, formats, validation]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum

      - name: go test (group ${{ matrix.group }})
        working-directory: dss
        run: |
          set -o pipefail
          case "${{ matrix.group }}" in
            core)
              PKGS="./alert/... ./enumerations/... ./i18n/... ./utils/... ./model/... ./document/... ./token/... ./spi/... ./crlparser/... ./cms/... ./cades/... ./internal/..."
              ;;
            formats)
              PKGS="./xml/... ./xades/... ./jades/... ./pades/... ./asic/... ./policy/..."
              ;;
            validation)
              PKGS="./validation/... ./diagnostic/... ./detailedreport/... ./simplereport/... ./simplecertificatereport/... ./validationreport/... ./trustedlist/... ./tsl/... ./harness/... ./examples/... ./cmd/... ."
              ;;
            *)
              echo "unknown group: ${{ matrix.group }}" >&2
              exit 2
              ;;
          esac
          go test $PKGS -count=1 -v 2>&1 | tee "test-output-${{ matrix.group }}.log"

          # A full checkout ships corpus/ alongside dss/, so no test should
          # hit corpustest's "corpus/ not found" skip path. Assert that
          # specifically, rather than a bare zero-skips count: two
          # pre-existing, unrelated skips (internal/pdf's
          # TestWriterOverCorpus / TestDumpWriterOutputs) are gated on their
          # own PDF_CORPUS_DIR / PDFOUT env vars for an out-of-tree upstream
          # checkout, not on corpus/ presence, and are expected here.
          if grep -q 'corpustest: corpus/ not found' "test-output-${{ matrix.group }}.log"; then
            echo "corpustest skipped a test even though corpus/ is present in this checkout:"
            grep 'corpustest: corpus/ not found' "test-output-${{ matrix.group }}.log"
            exit 1
          fi

      # On failure, restate the failures at the END of the job log: the
      # Actions log API serves only the last few thousand lines, and a
      # verbose multi-package run buries its FAIL lines mid-stream. Also
      # dump memory state and any kernel OOM kills — runner-only failures
      # that don't reproduce locally are frequently resource kills.
      - name: failure summary
        if: failure()
        working-directory: dss
        run: |
          echo "===== FAILURE SUMMARY (group ${{ matrix.group }}) ====="
          grep -En '^(--- )?FAIL|\[build failed\]|panic:|signal:|killed|out of memory|no space left' \
            "test-output-${{ matrix.group }}.log" | head -80 || echo "(no FAIL/panic/signal lines found in the log)"
          echo "===== first failure context ====="
          first=$(grep -m1 -nE '^--- FAIL|\[build failed\]|panic:' "test-output-${{ matrix.group }}.log" | cut -d: -f1)
          if [ -n "$first" ]; then
            start=$((first > 40 ? first - 40 : 1))
            sed -n "${start},$((first + 60))p" "test-output-${{ matrix.group }}.log"
          fi
          echo "===== resources ====="
          free -h || true
          df -h . || true
          sudo dmesg 2>/dev/null | grep -iE 'oom|killed process' | tail -10 || true

      - name: upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.group }}
          path: dss/test-output-${{ matrix.group }}.log

  cli-and-examples:
    name: cli build & examples vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum

      - name: make cli-build
        working-directory: dss
        run: make cli-build

      - name: esig version smoke check
        working-directory: dss
        run: ./bin/esig version

      - name: go vet examples + cmd
        working-directory: dss
        run: go vet ./examples/... ./cmd/...
